# Pushing a tag like v0.4.0 builds HolyMoly-0.4.0.zip (tools/package.sh) and publishes it as a GitHub release,
# with that version's section of CHANGELOG.md as the notes. The tag must match "## Version" in the TOC.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the TOC version
        run: |
          version=$(sed -n 's/^## Version: //p' HolyMoly/HolyMoly.toc | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match ## Version $version in HolyMoly/HolyMoly.toc" >&2
            exit 1
          fi

      - name: Build the zip
        run: tools/package.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Holy Moly $GITHUB_REF_NAME" --notes-file notes.md
